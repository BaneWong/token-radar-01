<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>Token Launch Radar</title>
<style>
/* ── Reset & Base ─────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 14px; }
body {
  font-family: -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
  background: #0B0D10;
  color: #E6E8EB;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── Colors ───────────────────────────────────────────────── */
:root {
  --bg: #0B0D10;
  --surface: #14181D;
  --line: #232A32;
  --text: #E6E8EB;
  --muted: #9BA3AE;
  --accent: #E8B54B;
  --pos: #35C08A;
  --neg: #E0574B;
}

/* ── KPI Bar ──────────────────────────────────────────────── */
.kpi-bar {
  display: flex;
  gap: 32px;
  padding: 20px 24px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
}
.kpi-item { display: flex; flex-direction: column; }
.kpi-label { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
.kpi-value { font-size: 32px; font-weight: 700; color: var(--text); }
.kpi-value.accent { color: var(--accent); }

/* ── Filter Bar ───────────────────────────────────────────── */
.filter-bar {
  display: flex;
  gap: 12px;
  padding: 12px 24px;
  border-bottom: 1px solid var(--line);
  align-items: center;
  flex-wrap: wrap;
}
.filter-bar select, .filter-bar input {
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--line);
  border-radius: 4px;
  padding: 6px 10px;
  font-size: 13px;
  font-family: inherit;
}
.filter-bar select:focus, .filter-bar input:focus { outline: 1px solid var(--accent); }
.filter-label { font-size: 12px; color: var(--muted); }
.filter-count { font-size: 11px; color: var(--accent); margin-left: auto; }

/* ── Table ────────────────────────────────────────────────── */
.table-wrap { overflow-y: auto; max-height: calc(100vh - 200px); }
table { width: 100%; border-collapse: collapse; }
thead { position: sticky; top: 0; z-index: 1; }
th {
  background: var(--surface);
  color: var(--muted);
  font-size: 13px;
  font-weight: 600;
  letter-spacing: .04em;
  text-transform: uppercase;
  padding: 10px 12px;
  text-align: left;
  border-bottom: 1px solid var(--line);
  white-space: nowrap;
}
td {
  padding: 10px 12px;
  font-size: 13px;
  border-bottom: 1px solid var(--line);
  vertical-align: middle;
}
tr:nth-child(even) { background: var(--bg); }
tr:nth-child(odd) { background: var(--surface); }
tr:hover { background: #1a1f25; cursor: pointer; }

/* Column alignments */
.col-name { font-weight: 500; max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.col-num { font-family: ui-monospace, "SF Mono", Menlo, monospace; text-align: right; white-space: nowrap; }
.col-action { font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
.col-chains { color: var(--muted); font-size: 12px; }

/* Action badges */
.badge-pos { color: var(--pos); }
.badge-neg { color: var(--neg); }
.badge-muted { color: var(--muted); }

/* Probability bar */
.prob-bar { width: 60px; height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; display: inline-block; vertical-align: middle; margin-right: 6px; }
.prob-fill { height: 100%; border-radius: 3px; }

/* ── Detail Drawer ────────────────────────────────────────── */
.drawer-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 10;
  opacity: 0; pointer-events: none; transition: opacity .2s;
}
.drawer-overlay.open { opacity: 1; pointer-events: auto; }
.drawer {
  /* 从右边沿滑入：动画 transform（合成层），不用 right（会横穿整个视口） */
  position: fixed; top: 0; right: 0; bottom: 0; width: 480px;
  background: var(--surface); border-left: 1px solid var(--line);
  z-index: 11; transform: translateX(100%);
  transition: transform .24s cubic-bezier(.32,.72,0,1);
  overflow-y: auto; padding: 24px;
  will-change: transform;
}
.drawer.open { transform: translateX(0); }
@media (prefers-reduced-motion: reduce) { .drawer { transition: none; } }
.drawer-close {
  position: absolute; top: 16px; right: 16px; background: none; border: none;
  color: var(--muted); font-size: 20px; cursor: pointer;
}
.drawer-close:hover { color: var(--text); }
.drawer h2 { font-size: 19px; font-weight: 600; margin-bottom: 4px; padding-right: 40px; }
.drawer .subtitle { font-size: 12px; color: var(--muted); margin-bottom: 20px; }
.drawer-section { margin-bottom: 20px; }
.drawer-section h3 { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 8px; }
.drawer-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--line); font-size: 13px; }
.drawer-row .label { color: var(--muted); }
.drawer-row .value { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
.drawer-row .value.accent { color: var(--accent); }
.risk-item { padding: 6px 0; font-size: 13px; color: var(--text); }
.risk-item::before { content: "⚠ "; color: var(--neg); }
.comp-table { width: 100%; border-collapse: collapse; font-size: 12px; }
.comp-table td { padding: 4px 8px; border-bottom: 1px solid var(--line); }

/* ── Utility ──────────────────────────────────────────────── */
.text-accent { color: var(--accent); }
.text-pos { color: var(--pos); }
.text-neg { color: var(--neg); }
</style>
</head>

<!-- Table -->
<div class="table-wrap">

// ── State ─────────────────────────────────────────────────────
let filteredData = [...BOARD_DATA];

// ── Format helpers ────────────────────────────────────────────
function fmtUSD(v) {
  if (v >= 1e9) return '$' + (v/1e9).toFixed(2) + 'B';
  if (v >= 1e6) return '$' + Math.round(v/1e6) + 'M';
  if (v >= 1e3) return '$' + Math.round(v/1e3) + 'K';
  return '$' + v.toFixed(0);
}

function probColor(p) { return p >= 0.7 ? 'var(--pos)' : p >= 0.4 ? 'var(--accent)' : 'var(--neg)'; }
function actionClass(a) { return a === '建仓' ? 'text-pos' : a === '回避' ? 'text-neg' : 'badge-muted'; }

// ── Render ────────────────────────────────────────────────────
function render() {
  // KPIs — meaningful sample: TVL ≥ $10M
  const MIN_TVl = 10e6;
  const actionable = BOARD_DATA.filter(r => r.tvl >= MIN_TVl);
  const watchlist = BOARD_DATA.length;
  const actionableCount = actionable.length;
  const sorted = [...actionable].sort((a,b) => a.impliedFDV - b.impliedFDV);
  const medianFDV = sorted[Math.floor(sorted.length/2)].impliedFDV;
  const highConv = actionable.filter(r => r.probability >= 0.7).length;

  document.getElementById('kpi-watchlist').textContent = watchlist;
  document.getElementById('kpi-fdv').textContent = fmtUSD(medianFDV);
  document.getElementById('kpi-conviction').textContent = highConv;
  document.getElementById('summary-text').textContent =
    `${watchlist} 个 pre-token 协议；TVL≥$10M 的 ${actionableCount} 个为可行动样本`;

  // Filter
  const cat = document.getElementById('filter-cat').value;
  const prob = parseFloat(document.getElementById('filter-prob').value);
  const sort = document.getElementById('filter-sort').value;

  filteredData = BOARD_DATA.filter(r => {
    if (cat && r.category !== cat) return false;
    if (r.probability < prob) return false;
    if (window._filterActionable && r.tvl < 10e6) return false;
    return true;
  });

  filteredData.sort((a, b) => {
    if (sort === 'fdv') return b.impliedFDV - a.impliedFDV;
    if (sort === 'tvl') return b.tvl - a.tvl;
    if (sort === 'prob') return b.probability - a.probability;
    return 0;
  });

  // Hash
  const params = new URLSearchParams();
  if (cat) params.set('cat', cat);
  if (prob > 0) params.set('p', String(prob));
  if (sort !== 'fdv') params.set('s', sort);
  location.hash = params.toString();

  // Count
  document.getElementById('filter-count').textContent = filteredData.length + ' / ' + BOARD_DATA.length;

  // Table
  const tbody = document.getElementById('board-body');
  tbody.innerHTML = filteredData.slice(0, 200).map((r, i) => `
    <tr data-idx="${BOARD_DATA.indexOf(r)}">
      <td class="col-name" title="${r.protocol}">${r.protocol}</td>
      <td>${r.category}</td>
      <td class="col-num">${fmtUSD(r.tvl)}</td>
      <td class="col-num accent">${fmtUSD(r.impliedFDV)}</td>
      <td style="text-align:center">
        <span class="prob-bar"><span class="prob-fill" style="width:${r.probability*100}%;background:${probColor(r.probability)}"></span></span>
        ${(r.probability*100).toFixed(0)}%
      </td>
      <td class="col-action ${actionClass(r.action)}">${r.action}</td>
      <td class="col-chains">${r.chains}</td>
    </tr>
  `).join('');

  // Click handlers
  tbody.querySelectorAll('tr').forEach(tr => {
    tr.addEventListener('click', () => openDrawer(parseInt(tr.dataset.idx)));
  });
}

// ── Drawer ────────────────────────────────────────────────────
function openDrawer(idx) {
  const r = BOARD_DATA[idx];
  const ratio = (r.impliedFDV / Math.max(r.tvl, 1)).toFixed(1);
  const content = document.getElementById('drawer-content');
  content.innerHTML = `
    <h2>${r.protocol}</h2>
    <div class="subtitle">${r.category} · ${r.chains}</div>

    <div class="drawer-section">
      <h3>估值推导</h3>
      <div class="drawer-row"><span class="label">TVL</span><span class="value">${fmtUSD(r.tvl)}</span></div>
      <div class="drawer-row"><span class="label">隐含 FDV</span><span class="value accent">${fmtUSD(r.impliedFDV)}</span></div>
      <div class="drawer-row"><span class="label">FDV / TVL</span><span class="value">${ratio}x</span></div>
    </div>

    <div class="drawer-section">
      <h3>风险评估</h3>
      <div class="risk-item">无代币历史，先发优势不确定</div>
      <div class="risk-item">TVL 可能来自锁定资产而非真实需求</div>
      <div class="risk-item">同类协议代币表现差异大</div>
    </div>

    <div class="drawer-section">
      <h3>建议动作</h3>
      <div class="drawer-row"><span class="label">动作</span><span class="value ${actionClass(r.action)}">${r.action}</span></div>
      <div class="drawer-row"><span class="label">概率</span><span class="value">${(r.probability*100).toFixed(0)}%</span></div>
      <div class="drawer-row"><span class="label">理由</span><span class="value" style="text-align:right;max-width:200px">${r.actionReason}</span></div>
    </div>

    <div class="drawer-section">
      <h3>同类对比 (Top 5)</h3>
      <table class="comp-table">
        <tr><th>协议</th><th style="text-align:right">TVL</th><th style="text-align:right">FDV</th></tr>
        ${BOARD_DATA.filter(x => x.category === r.category).slice(0,5).map(x =>
          `<tr><td>${x.protocol}</td><td style="text-align:right">${fmtUSD(x.tvl)}</td><td style="text-align:right">${fmtUSD(x.impliedFDV)}</td></tr>`
        ).join('')}
      </table>
    </div>
  `;
  document.getElementById('drawer-overlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');
}

function closeDrawer() {
  document.getElementById('drawer-overlay').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
}

document.getElementById('drawer-close').addEventListener('click', closeDrawer);
document.getElementById('drawer-overlay').addEventListener('click', closeDrawer);

// ── Init ──────────────────────────────────────────────────────
// Populate category filter
const categories = [...new Set(BOARD_DATA.map(r => r.category))].sort();
const catSelect = document.getElementById('filter-cat');
categories.forEach(c => {
  const opt = document.createElement('option');
  opt.value = c; opt.textContent = c;
  catSelect.appendChild(opt);
});

// Restore hash
const params = new URLSearchParams(location.hash.slice(1));
if (params.has('cat')) catSelect.value = params.get('cat');
if (params.has('p')) document.getElementById('filter-prob').value = params.get('p');
if (params.has('s')) document.getElementById('filter-sort').value = params.get('s');

catSelect.addEventListener('change', render);
document.getElementById('filter-prob').addEventListener('change', render);
document.getElementById('filter-sort').addEventListener('change', render);

// Quick buttons
document.getElementById('btn-actionable').addEventListener('click', () => {
  document.getElementById('filter-prob').value = '0';
  document.getElementById('filter-cat').value = '';
  document.getElementById('filter-sort').value = 'fdv';
  // Apply TVL filter by temporarily modifying the filter function
  window._filterActionable = true;
  render();
});
document.getElementById('btn-reset').addEventListener('click', () => {
  document.getElementById('filter-prob').value = '0';
  document.getElementById('filter-cat').value = '';
  document.getElementById('filter-sort').value = 'fdv';
  window._filterActionable = false;
  location.hash = '';
  render();
});

render();
</script>
</body>
</html>
